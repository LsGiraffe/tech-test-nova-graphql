input ApproveDocumentInput {
  documentId: ID!
}

type ApproveDocumentPayload {
  document: Document
}

"""
An ISO 8601-encoded datetime
"""
scalar DateTime @specifiedBy(url: "https://tools.ietf.org/html/rfc3339")

type Document {
  approvedAt: DateTime
  documentType: String!
  file: DocumentFile
  id: ID!
  instructions: String
  internalNote: String
  rejectedAt: DateTime
  rejectionReason: String
  requestedAt: DateTime!
  status: DocumentStatus!
  submittedAt: DateTime
}

"""
Simulated stored file backed by the starter file_url; no object storage integration.
"""
type DocumentFile {
  id: ID!
  url: String!
}

enum DocumentStatus {
  APPROVED
  REJECTED
  REQUESTED
  SUBMITTED
}

type MortgageProject {
  documents: [Document!]!
  id: ID!
  isBlocked: Boolean!
}

type Mutation {
  """
  Approves a submitted document in the expert’s authorized project.
  """
  approveDocument(input: ApproveDocumentInput!): ApproveDocumentPayload!
}

type Query {
  clientProject: MortgageProject!

  """
  Health check. Needs no caller.
  """
  ping: String!
}
